services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE in backend/.env}
      POSTGRES_USER: ${PGUSER:?Set PGUSER in backend/.env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in backend/.env}
    ports:
      - "5432:5432"
    volumes:
      - spendwise-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE in backend/.env}
      PGUSER: ${PGUSER:?Set PGUSER in backend/.env}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in backend/.env}
      PGSSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a base64-encoded random key}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
volumes:
  spendwise-postgres:
