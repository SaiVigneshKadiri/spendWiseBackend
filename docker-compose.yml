services:
  # The API connects to the Neon Postgres database named in backend/.env (PG* variables).
  api:
    build: .
    environment:
      PGHOST: ${PGHOST:?Set PGHOST (Neon host) in backend/.env}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE in backend/.env}
      PGUSER: ${PGUSER:?Set PGUSER in backend/.env}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in backend/.env}
      PGSSLMODE: ${PGSSLMODE:-require}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a base64-encoded random key}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
    ports:
      # 8081 on the host: port 8080 is taken on the LAN address by a local Apache service.
      - "8081:8080"
